listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349
relay-ip=0.0.0.0
external-ip=127.0.0.1
min-port=49160
max-port=49169
# Candidate bound: one allocation for each endpoint in the one-call harness.
user-quota=2
total-quota=2
fingerprint
use-auth-secret
realm=voice-pipecat-e2e.invalid
cert=/run/murmur-coturn/cert.pem
pkey=/run/murmur-coturn/key.pem
no-udp
no-tcp
# Keep peer-side relay UDP-only; client-to-TURN remains TLS/TCP on turns:.
no-tcp-relay
no-dtls
no-tlsv1
no-tlsv1_1
no-cli
allow-loopback-peers
no-multicast-peers
stale-nonce=60
log-file=stdout
simple-log
pidfile=/tmp/turnserver.pid
userdb=/tmp/turnserver.db
