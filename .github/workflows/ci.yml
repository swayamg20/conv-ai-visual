name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: test-api-key
      TTS_PROVIDER: kokoro
      SMART_TURN_ENABLED: "false"
      MURMUR_DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev --extra voice-v2 --extra voice-pipecat

      - name: Lint backend
        run: uv run ruff check .

      - name: Check backend formatting
        run: uv run ruff format --check .

      - name: Test backend
        run: uv run pytest

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:test"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  rtc:
    name: Offline RTC browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev --extra voice-v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run real RTC browser proof
        run: >-
          uv run python scripts/voice_e2e_stack.py
          --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          --startup-timeout 90
          --browser-timeout 120
          --cleanup-timeout 45
          --web-build-timeout 300

      - name: Upload RTC proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: voice-rtc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/voice-e2e/
            var/evals/voice-e2e-*.jsonl
          if-no-files-found: ignore
          retention-days: 7

  pipecat_rtc:
    name: Pipecat provider-free RTC browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Pipecat dependencies
        run: uv sync --locked --extra dev --extra voice-pipecat

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run provider-free Pipecat RTC browser proof
        run: >-
          uv run python scripts/voice_pipecat_e2e_stack.py
          --run-id ci-pipecat-${{ github.run_id }}-${{ github.run_attempt }}
          --startup-timeout-seconds 90
          --browser-timeout-seconds 120
          --web-build-timeout-seconds 300

      - name: Upload sanitized Pipecat RTC proofs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: voice-pipecat-rtc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/voice-pipecat-e2e/ci-pipecat-${{ github.run_id }}-${{ github.run_attempt }}/rtc-stack-proof.json
            var/voice-pipecat-e2e/ci-pipecat-${{ github.run_id }}-${{ github.run_attempt }}/playwright/voice-pipecat-rtc-result.json
          if-no-files-found: error
          retention-days: 7
