name: CI

on:
  push:
    branches:
      - main
      - "codex/gate15-*"
      - "codex/gate16-*"
      - "codex/gate17-*"
      - "codex/gate18-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: test-api-key
      TTS_PROVIDER: kokoro
      SMART_TURN_ENABLED: "false"
      MURMUR_DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev --extra voice-v2 --extra voice-pipecat

      - name: Lint backend
        run: uv run ruff check .

      - name: Check backend formatting
        run: uv run ruff format --check .

      - name: Test backend
        run: uv run pytest

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:test"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  scene:
    name: Verified scene browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run verified scene browser proof
        run: npm run e2e:scene

      - name: Upload scene proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verified-scene-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/scene-e2e/
          if-no-files-found: error
          retention-days: 7

  live_choreography:
    name: Provider-free live choreography proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHOREOGRAPHY_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Test live choreography artifact validation
        run: npm run test:choreography-artifacts

      - name: Test live choreography human-review validation
        run: npm run test:choreography-review

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare live choreography artifacts
        run: npm run prepare:choreography-artifacts

      - name: Run accelerated live choreography proof
        run: npm run e2e:choreography

      - name: Capture real-speed live choreography proof
        run: npm run capture:choreography

      - name: Finalize live choreography artifact manifest
        run: npm run finalize:choreography-artifacts

      - name: Validate live choreography artifacts
        run: npm run validate:choreography-artifacts

      - name: Validate recorded live choreography review
        run: npm run validate:choreography-review

      - name: Upload live choreography proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-choreography-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/live-choreography/
          if-no-files-found: error
          retention-days: 7

  parametric_choreography:
    name: Provider-free parametric choreography proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accelerated parametric choreography proof
        run: npm run e2e:parametric-choreography

      - name: Capture real-speed parametric choreography proof
        run: npm run e2e:parametric-choreography:capture

      - name: Run authenticated product-request smoke
        run: npm run e2e:parametric-choreography:product-smoke

      - name: Upload parametric choreography proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parametric-choreography-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/parametric-choreography-e2e/
          if-no-files-found: error
          retention-days: 7

  projectile_motion:
    name: Provider-free projectile motion proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECTILE_MOTION_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test projectile motion artifact validation
        run: npm run test:projectile-motion-artifacts

      - name: Prepare projectile motion artifacts
        run: npm run prepare:projectile-motion-artifacts

      - name: Run accelerated projectile motion proof
        run: npm run e2e:projectile-motion

      - name: Capture real-speed projectile motion proof
        run: npm run e2e:projectile-motion:capture

      - name: Run authenticated projectile product smoke
        run: npm run e2e:projectile-motion:product-smoke

      - name: Finalize projectile motion artifact manifest
        run: npm run finalize:projectile-motion-artifacts

      - name: Validate projectile motion artifacts
        run: npm run validate:projectile-motion-artifacts

      - name: Upload projectile motion proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: projectile-motion-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/projectile-motion-e2e/
          if-no-files-found: error
          retention-days: 7

  semantic_storyboard:
    name: Provider-free semantic storyboard proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEMANTIC_STORYBOARD_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out exact semantic storyboard source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test semantic storyboard artifact validation
        run: npm run test:semantic-storyboard-artifacts

      - name: Prepare semantic storyboard artifacts
        run: npm run prepare:semantic-storyboard-artifacts

      - name: Run accelerated semantic storyboard proof
        run: npm run e2e:semantic-storyboard

      - name: Capture normal-speed semantic storyboard proof
        run: npm run e2e:semantic-storyboard:capture

      - name: Run authenticated semantic storyboard product smoke
        run: npm run e2e:semantic-storyboard:product-smoke

      - name: Finalize semantic storyboard artifact manifest
        run: npm run finalize:semantic-storyboard-artifacts

      - name: Validate semantic storyboard artifacts
        run: npm run validate:semantic-storyboard-artifacts

      - name: Upload semantic storyboard proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: semantic-storyboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/semantic-storyboard-e2e/
          if-no-files-found: error
          retention-days: 7

  rtc:
    name: Offline RTC browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev --extra voice-v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run real RTC browser proof
        run: >-
          uv run python scripts/voice_e2e_stack.py
          --run-id ci-${{ github.run_id }}-${{ github.run_attempt }}
          --startup-timeout 90
          --browser-timeout 120
          --cleanup-timeout 45
          --web-build-timeout 300

      - name: Upload RTC proof artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: voice-rtc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/voice-e2e/
            var/evals/voice-e2e-*.jsonl
          if-no-files-found: ignore
          retention-days: 7

  pipecat_rtc:
    name: Pipecat provider-free RTC browser proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked Pipecat dependencies
        run: uv sync --locked --extra dev --extra voice-pipecat

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run provider-free Pipecat RTC browser proof
        run: >-
          uv run python scripts/voice_pipecat_e2e_stack.py
          --run-id ci-pipecat-${{ github.run_id }}-${{ github.run_attempt }}
          --startup-timeout-seconds 90
          --browser-timeout-seconds 120
          --web-build-timeout-seconds 300

      - name: Upload sanitized Pipecat RTC proofs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: voice-pipecat-rtc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/voice-pipecat-e2e/ci-pipecat-${{ github.run_id }}-${{ github.run_attempt }}/rtc-stack-proof.json
            var/voice-pipecat-e2e/ci-pipecat-${{ github.run_id }}-${{ github.run_attempt }}/playwright/voice-pipecat-rtc-result.json
          if-no-files-found: error
          retention-days: 7
